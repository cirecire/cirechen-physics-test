<script>
const KEY='phys8_ch02_state';
let S=load();

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const LESSONS=[
 {id:'intro',t:'Intro',cn:'Start here · What this chapter covers',n:'🏠'},
 {id:'k1',t:'Production & Propagation',cn:'Sound production and propagation',n:'2.1'},
 {id:'k2',t:'Characteristics',cn:'Characteristics of sound',n:'2.2'},
 {id:'k3',t:'Uses of Sound',cn:'Uses of sound',n:'2.3'},
 {id:'k4',t:'Noise & Control',cn:'Noise and its control',n:'2.4'},
 {id:'test',t:'Chapter check',cn:'Chapter check',n:''}
];
let cur='intro';

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[ri(0,a.length-1)];}
function L(a,b){ return '<span class="en">'+a+'</span><span class="zh">'+(b==null?a:b)+'</span>'; }

/* ===== Video list (Khan Academy · embedded via YouTube; yt filled in mapping pass) ===== */
const VIDEOS={
k1:[
 {f:'',yt:'nGKffdaI4Pg',t:'Production of sound',c:'core'},
 {f:'',yt:'UgE2GIQwUCw',t:'Speed of Sound',c:'core'},
 {f:'',yt:'yF4cvbAYjwI',t:'Relative speed of sound in solids, liquids, and gases',c:'ext'},
],
k2:[
 {f:'',yt:'-_xZZt99MzY',t:'Sound Properties (Amplitude, Period, Frequency, Wavelength)',c:'core'},
 {f:'',yt:'46V8qqVRirk',t:'Why do sounds get softer?',c:'core'},
 {f:'',yt:'tJW_a6JeXD8',t:'Amplitude, period, frequency and wavelength of periodic waves',c:'ext'},
],
k3:[
 {f:'',yt:'sTcqtljxLOk',t:'Ultrasound medical imaging',c:'core'},
 {f:'',yt:'9u1PjsBfrmg',t:'Sound waves',c:'ext'},
],
k4:[
 {f:'',yt:'peSLM4XObBE',t:'Auditory processing',c:'ext'}
]
};
const VTZ={
 'Production of sound':'声音的产生',
 'Speed of Sound':'声音的速度',
 'Relative speed of sound in solids, liquids, and gases':'固体、液体、气体中的声速比较',
 'Sound Properties (Amplitude, Period, Frequency, Wavelength)':'声音的性质（振幅·周期·频率·波长）',
 'Why do sounds get softer?':'声音为什么会变弱？',
 'Amplitude, period, frequency and wavelength of periodic waves':'周期波的振幅、周期、频率与波长',
 'Ultrasound medical imaging':'超声波医学成像',
 'Sound waves':'声波',
 'Auditory processing':'听觉加工'
};

/* ============ Lesson K1: production & propagation ============ */
function microK1(el){
 el.innerHTML=`
  <div class="step"><span class="en">Where does a sound start, and how does it travel?</span><span class="zh">声音从哪里开始，又是怎么传开的？</span></div>
  <div class="box">
   <h3><span class="en">Vibration makes sound</span><span class="zh">振动产生声音</span></h3>
   <p><span class="en">Every sounding object vibrates — a guitar string, a speaker cone, your vocal cords. Stop the vibration and the sound stops too.</span><span class="zh">一切发声的物体都在振动——琴弦、喇叭纸盆、声带都是。振动一停，声音也就停了。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">Sound needs a medium</span><span class="zh">声音需要介质</span></h3>
   <p><span class="en">Sound travels by making particles bump into each other: air, water, or a solid. In empty space (a vacuum) there is nothing to bump, so sound cannot travel.</span><span class="zh">声音靠粒子互相碰撞传播：空气、水或者固体都行。真空里没有粒子可撞，所以声音传不过去。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">How fast?</span><span class="zh">速度有多快</span></h3>
   <p><span class="en">In air at room temperature sound travels about <b class="num">340 m/s</b>. It moves faster through liquids and fastest through solids: solid &gt; liquid &gt; gas.</span><span class="zh">常温下空气中声速约为 <b class="num">340 m/s</b>。在液体里更快，在固体里最快：固体 &gt; 液体 &gt; 气体。</span></p>
  </div>`;
}

/* ============ Lesson K2: characteristics ============ */
function microK2(el){
 el.innerHTML=`
  <div class="step"><span class="en">Why do two notes sound different?</span><span class="zh">为什么两个音听起来不一样？</span></div>
  <div class="box">
   <h3><span class="en">Pitch = frequency</span><span class="zh">音调 = 频率</span></h3>
   <p><span class="en">Pitch is set by frequency (measured in hertz, Hz). More vibrations per second means a higher pitch.</span><span class="zh">音调由频率决定（单位是赫兹 Hz）。每秒振动次数越多，音调越高。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">Loudness = amplitude</span><span class="zh">响度 = 振幅</span></h3>
   <p><span class="en">Loudness is set by amplitude — how far the particles swing. A bigger swing makes a louder sound.</span><span class="zh">响度由振幅决定——粒子摆动多大。摆得越大，声音越响。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">Timbre = waveform</span><span class="zh">音色 = 波形</span></h3>
   <p><span class="en">Timbre comes from the shape of the wave. That is why a flute and a violin playing the same pitch at the same loudness still sound different.</span><span class="zh">音色来自波的形状。所以长笛和小提琴即使音高、响度相同，听起来也不一样。</span></p>
  </div>`;
}

/* ============ Lesson K3: uses of sound ============ */
function microK3(el){
 el.innerHTML=`
  <div class="step"><span class="en">Sound can carry information and energy.</span><span class="zh">声音既能传递信息，也能传递能量。</span></div>
  <div class="box">
   <h3><span class="en">Sound as information</span><span class="zh">声音传递信息</span></h3>
   <p><span class="en">Bats and ships send out sound and listen for the echo — that is echolocation and sonar. Doctors use ultrasound to make pictures inside the body (B-mode scan).</span><span class="zh">蝙蝠和船只发出声音、再听回声，这叫回声定位，也叫声纳。医生用超声波给身体内部成像（B 超）。</span></p>
  </div>
  <div class="box">

/* ============ Practice generators (by topic) ============ */
const generators={
k1:()=>{ // production & propagation
 const type=ri(1,3);
 if(type===1){
  const t=ri(2,8);
  return {q:`Lightning is seen and thunder is heard ${t} s later. How far away is the storm (m)? (use v = 340 m/s)`,
   zhq:`闪电后 ${t} 秒听到雷声，风暴离你多远（米）？（声速 340 m/s）`,
   check:a=>parseInt(a)===340*t,ans:String(340*t),hint:'distance = speed × time',zhh:'距离 = 速度 × 时间',
   sol:`d = 340 × ${t} = ${340*t} m`,zhs:`d = 340 × ${t} = ${340*t} 米`};
 } else if(type===2){
  const t=ri(2,6);
  return {q:`You shout and hear the echo after ${t} s. How far is the cliff (m)? (sound travels to the cliff and back; v = 340 m/s)`,
   zhq:`你喊一声，${t} 秒后听到回声。悬崖有多远（米）？（声音往返；声速 340 m/s）`,
   check:a=>parseInt(a)===170*t,ans:String(170*t),hint:'the sound goes there and back, so d = v×t/2',zhh:'声音往返，故 d = v·t/2',
   sol:`d = 340 × ${t} / 2 = ${170*t} m`,zhs:`d = 340 × ${t} / 2 = ${170*t} 米`};
 } else {
  return {q:`In which material does sound travel fastest: air, water, or steel? (type: air / water / steel)`,
   zhq:`声音在哪种物质里传得最快：空气、水，还是钢？（填 air / water / steel）`,
   check:a=>a.trim().toLowerCase()==='steel',ans:'steel',choice:true,
   hint:'solids carry sound faster than liquids, liquids faster than gases.',zhh:'固体传声比液体快，液体比气体快。'};
 }
},
k2:()=>{ // characteristics
 const type=ri(1,4);
 if(type===1){
  return {q:`A higher pitch means a higher ___ (type: frequency / amplitude)`,
   zhq:`音调越高，说明___越大（填 frequency / amplitude）`,
   check:a=>a.trim().toLowerCase()==='frequency',ans:'frequency',choice:true,
   hint:'pitch is set by frequency.',zhh:'音调由频率决定。'};
 } else if(type===2){
  return {q:`A louder sound has a larger ___ (type: amplitude / frequency)`,
   zhq:`声音越响，___越大（填 amplitude / frequency）`,
   check:a=>a.trim().toLowerCase()==='amplitude',ans:'amplitude',choice:true,
   hint:'loudness is set by amplitude.',zhh:'响度由振幅决定。'};
 } else if(type===3){
  return {q:`Two instruments play the same note but sound different — that is because of their ___ (type: timbre / wavelength)`,
   zhq:`两种乐器演奏同一音高却听起来不同，是因为它们的___（填 timbre / wavelength）`,
   check:a=>a.trim().toLowerCase()==='timbre',ans:'timbre',choice:true,
   hint:'timbre comes from the waveform shape.',zhh:'音色来自波形形状。'};
 } else {
  const f1=ri(200,900),f2=f1+ri(100,500);
  return {q:`A sound at ${f2} Hz sounds ___ pitched than one at ${f1} Hz (type: higher / lower)`,
   zhq:`${f2} Hz 的声音比 ${f1} Hz 的声音音调更___（填 higher / lower）`,
   check:a=>a.trim().toLowerCase()==='higher',ans:'higher',choice:true,
   hint:'more Hz means a higher pitch.',zhh:'频率越高，音调越高。'};
 }
},
k3:()=>{ // uses of sound
 const type=ri(1,3);
 if(type===1){
  return {q:`Sound with a frequency above ___ Hz is called ultrasound.`,
   zhq:`频率高于___ Hz 的声波称为超声波。`,
   check:a=>parseInt(a)===20000,ans:'20000',
   hint:'ultrasound sits above the human hearing range (20 000 Hz).',zhh:'超声在人类听觉上限 20000 Hz 之上。'};
 } else if(type===2){
  return {q:`Sound below 20 Hz is called ___ (type: infrasound / ultrasound)`,
   zhq:`频率低于 20 Hz 的声波称为___（填 infrasound / ultrasound）`,
   check:a=>a.trim().toLowerCase()==='infrasound',ans:'infrasound',choice:true,
   hint:'infra means below.',zhh:'infra 表示「低于」。'};
 } else {
  return {q:`B-ultrasound is used for ___ (type: medical imaging / room lighting)`,
   zhq:`B 超用于___（填 medical imaging / room lighting）`,
   check:a=>a.trim().toLowerCase()==='medical imaging',ans:'medical imaging',choice:true,
   hint:'ultrasound makes pictures inside the body.',zhh:'超声波能给身体内部成像。'};
 }
},
k4:()=>{ // noise & control
 const type=ri(1,3);
 if(type===1){
  return {q:`Repeated exposure above ___ dB can damage your hearing.`,
   zhq:`长期暴露在___ dB 以上会损伤听力。`,
   check:a=>parseInt(a)===90,ans:'90',
   hint:'90 dB is a common damage threshold.',zhh:'90 dB 是常见的损伤阈值。'};
 } else if(type===2){
  return {q:`To cut noise at the source you would ___ (type: turn off the machine / wear earplugs)`,
   zhq:`要在声源处减小噪声，你会___（填 turn off the machine / wear earplugs）`,
   check:a=>a.trim().toLowerCase()==='turn off the machine',ans:'turn off the machine',choice:true,
   hint:'at the source means stop it being made.',zhh:'声源处就是不让它发出。'};
 } else {
  return {q:`Wearing ear defenders reduces noise at the ___ (type: ear / source)`,
   zhq:`戴护耳器是在___处减小噪声（填 ear / source）`,
   check:a=>a.trim().toLowerCase()==='ear',ans:'ear',choice:true,
   hint:'ear defenders act on the listener.',zhh:'护耳器作用在听者身上。'};
 }
},
};

function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0,diff=1;
 function newQ(){q=gen(diff);tries=0;}
 const update=()=>{
  el.innerHTML=`
   <div class="step"><span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})</div>
   <div class="diff">
    Difficulty: 
    <button class="secondary ${diff===1?'on':''}" data-d="1">Easy</button>
    <button class="secondary ${diff===2?'on':''}" data-d="2">Medium</button>
    <button class="secondary ${diff===3?'on':''}" data-d="3">Hard</button>
    <span class="info">Correct: ${s.prac.ok}/${s.prac.tot} (streak ${streak})<button class="secondary" id="rs" style="margin-left:8px"><span class="en">Reset</span><span class="zh">重置</span></button></span>
   </div>
   <div class="progress"><div style="width:${(streak/need)*100}%"></div></div>
   <div class="q">
    <div class="q-text">${L(q.q,q.zhq)}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="pi" autocomplete="off" placeholder="?"> <button id="ps"><span class="en">Submit</span><span class="zh">提交</span></button>
    </div>
    <div class="hint" id="ph"></div>
    <div class="feedback" id="pf"></div>
   </div>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=parseInt(b.dataset.d);update();});
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;diff=1;save();update();renderNav();};
  const syncTop=()=>{
   const stp=el.querySelector('.step'); if(stp) stp.innerHTML='<span class="en">Practice</span><span class="zh">练习</span> ('+streak+'/'+need+')';
   const pg=el.querySelector('.progress'); if(pg&&pg.firstElementChild) pg.firstElementChild.style.width=(streak/need)*100+'%';
   const inf=el.querySelector('.info'); if(inf){const rb=inf.querySelector('#rs');inf.textContent='Correct: '+s.prac.ok+'/'+s.prac.tot+' (streak '+streak+') ';if(rb)inf.appendChild(rb);}
  };
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();
  el.querySelector('#ps').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.innerHTML=L('✓ correct!','✓ 对了！');
    inp.disabled=true;syncTop();
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>'+L('Section cleared ✓','本节过关 ✓')+'</strong>';save();renderNav();}
    else if(streak>=3&&diff<3){diff++;}
    setTimeout(()=>{newQ();update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.innerHTML=L(q.hint||'Have another go.', q.zhh||'再试一次。');
     fb.className='feedback show err';fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
    } else if(tries===2){
     fb.className='feedback show err';
     fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.')), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):(q.zhh?('提示：'+q.zhh):'再算一遍。')));
    } else {
     streak=0;s.prac.tot++;syncTop();
     if(diff>1)diff--;
     fb.className='feedback show err';
     fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
   save();
  }
 };
 newQ();update();
}

    +'① <b><span class="en">Watch the lesson</span><span class="zh">看微课</span></b>: <span class="en">a few minutes to get what the section is about</span><span class="zh">花几分钟了解本节内容</span><br>'
    +'② <b><span class="en">Practice</span><span class="zh">练一练</span></b>: <span class="en">5 correct in a row clears it; if you get stuck, hints walk you through</span><span class="zh">连对 5 题就算过关；卡住了就看提示</span><br>'
    +'③ <b><span class="en">Next section</span><span class="zh">下一节</span></b>: <span class="en">on the left, </span><span class="zh">在左侧，</span>'+pts[0].n+', '+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">'+pts[0].n+' <span class="en">'+pts[0].t+'</span><span class="zh">开始 · '+NAVZH[pts[0].id]+'</span> →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
const NAVZH={"intro":"概览","k1":"声音的产生与传播","k2":"声音的特性","k3":"声的利用","k4":"噪声的危害和控制","test":"章末自己测"};
const LKEY='phys8_lang';
function getLang(){return localStorage.getItem(LKEY)||'en';}
function setLang(l){localStorage.setItem(LKEY,l);applyLang();}
function applyLang(){const l=getLang();document.body.className=(' '+document.body.className+' ').replace(/\s+lang-(en|mix|zh)\b/g,' ').trim();if(l==='mix'||l==='zh')document.body.classList.add('lang-'+l);document.querySelectorAll('.langseg button').forEach(b=>{b.classList.toggle('on',b.dataset.lang===l);});}
applyLang();

function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}">
   <span><b>${l.n}</b> <span class="en">${l.t}</span><span class="zh">${NAVZH[l.id]||l.t}</span></span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{
  const id=n.dataset.go;
  cur = id==='test' ? 'test' : `micro-${id}`;
  render();
 });
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown lesson</div>';return;}
  const titles={k1:'Production & Propagation',k2:'Characteristics',k3:'Uses of Sound',k4:'Noise & Control'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · <span class="en">${titles[id]} · ${lesson.cn}</span><span class="zh">${NAVZH[id]||titles[id]}</span></div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){
   practice(c,id);
  }
 } else {
  introRender(main);
 }
}
render();
</script>
<script>
(function(){try{if(new URLSearchParams(location.search).get('go')==='test'){cur='test';render();}}catch(e){}})();
</script>
<script>
var TKEY='phys8_theme';
function getTheme(){try{return localStorage.getItem(TKEY)||'auto';}catch(e){return 'auto';}}
function setTheme(t){try{localStorage.setItem(TKEY,t);}catch(e){}applyTheme();}
function applyTheme(){
 var t=getTheme();
 document.documentElement.setAttribute('data-theme',t);
 var bs=document.querySelectorAll('.themseg button');
 for(var i=0;i<bs.length;i++){
  var on=(bs[i].getAttribute('data-theme')===t);
  if(on){bs[i].classList.add('on');}else{bs[i].classList.remove('on');}
 }
}
applyTheme();
try{var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener){mq.addEventListener('change',function(){if(getTheme()==='auto'){applyTheme();}});}}catch(e){}
</script>
