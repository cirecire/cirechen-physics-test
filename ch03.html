/* ============ Lesson K1: temperature ============ */
function microK1(el){
 el.innerHTML=`
  <div class="step"><span class="en">How do we tell "hot" from "cold"?</span><span class="zh">我们怎么区分「热」和「冷」？</span></div>
  <div class="box">
   <h3><span class="en">Temperature measures hotness</span><span class="zh">温度表示冷热程度</span></h3>
   <p><span class="en">Temperature tells how hot or cold something is. On the tiny scale it is the average speed of the particles: faster, jiggling particles feel hotter. We read it with a thermometer.</span><span class="zh">温度表示物体的冷热程度。从微观看，它对应粒子的平均运动快慢：动得越快的粒子，摸起来越热。我们用温度计来读数。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">The Celsius scale (°C)</span><span class="zh">摄氏度温标（°C）</span></h3>
   <p><span class="en">On the Celsius scale, water freezes at <b class="num">0 °C</b> and boils at <b class="num">100 °C</b>. Handy numbers: a cold day ≈ 0 °C, a room ≈ 20–25 °C, the human body ≈ 37 °C, boiling water ≈ 100 °C.</span><span class="zh">摄氏温标下，水结冰是 <b class="num">0 °C</b>，沸腾是 <b class="num">100 °C</b>。常用参考：寒冬 ≈ 0 °C、室内 ≈ 20–25 °C、人体 ≈ 37 °C、沸水 ≈ 100 °C。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">Thermal equilibrium</span><span class="zh">热平衡</span></h3>
   <p><span class="en">Put a hot cup and a cold cup side by side and they meet in the middle — they end up at the same temperature. That shared temperature is thermal equilibrium.</span><span class="zh">把一杯热的和一杯冷的放在一起，最后会停在中间某个温度——两者温度变得相同。这个共同温度就是热平衡。</span></p>
  </div>`;
}

/* ============ Lesson K2: melting & freezing ============ */
function microK2(el){
 el.innerHTML=`
  <div class="step"><span class="en">Why does ice turn to water, but not in a straight line?</span><span class="zh">为什么冰会变成水，而且过程不是「升温直线」？</span></div>
  <div class="box">
   <h3><span class="en">Three states of matter</span><span class="zh">物质的三态</span></h3>
   <p><span class="en">A solid keeps its own shape (ice). A liquid takes the shape of its container (water). A gas spreads out to fill the whole space (steam).</span><span class="zh">固体有固定形状（冰）；液体随容器改变形状（水）；气体会充满整个空间（水蒸气）。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">Melting — solid to liquid</span><span class="zh">熔化——固变液</span></h3>
   <p><span class="en">Heat ice and at <b class="num">0 °C</b> it turns to water. The temperature where a solid becomes a liquid is its melting point. For water that is 0 °C.</span><span class="zh">加热冰，到 <b class="num">0 °C</b> 时变成水。固体变成液体的那个温度叫熔点；水的熔点是 0 °C。</span></p>
  </div>
  <div class="box">
   <h3><span class="en">Freezing — liquid to solid</span><span class="zh">凝固——液变固</span></h3>
   <p><span class="en">Cool water below 0 °C and it turns back to ice. That is freezing, at the same temperature (the freezing point). While it melts or freezes, the temperature stays put — it does not rise or fall.</span><span class="zh">把水降到 0 °C 以下，它变回冰，这叫凝固，温度同样是 0 °C（凝固点）。熔化或凝固时，温度保持不变，不升也不降。</span></p>
  </div>
  <div class="bridge">
   <div class="bl"><span class="en">Bridge</span><span class="zh">衔接补全</span></div>
   <h3><span class="en">Why the temperature pauses during melting or boiling</span><span class="zh">为什么熔化或沸腾时温度会「停住」</span></h3>
   <p><span class="en">The heat you keep adding is not making the particles move faster (that is what raises temperature). It is being spent pulling the solid apart into a liquid, or the liquid apart into a gas. Until that change is finished, the temperature sits still. This "hidden" heat is called latent heat.</span><span class="zh">你持续加热，并没有让粒子运动得更快（那才是升温），而是用来把固体拆成液体、或把液体拆成气体。这一变化没完成之前，温度就一直停着。这份「藏起来」的热量叫潜热。</span></p>
  </div>`;
}

/* ============ Practice generators (by topic) ============ */
const generators={
k1:()=>{ // temperature
 const type=ri(1,5);
 if(type===1){
  return {q:`Water freezes (and melts) at ___ °C.`,
   zhq:`水的凝固点（也是熔点）是___ °C。`,
   check:a=>parseInt(a)===0,ans:'0',hint:'Celsius lower fixed point: ice ⇄ water.',zhh:'摄氏下固定点：冰⇄水。'};
 } else if(type===2){
  return {q:`Water boils at ___ °C at normal pressure.`,
   zhq:`标准大气压下水的沸点是___ °C。`,
   check:a=>parseInt(a)===100,ans:'100',hint:'Celsius upper fixed point.',zhh:'摄氏上固定点。'};
 } else if(type===3){
  return {q:`Normal human body temperature is about ___ °C (type: 37 / 100)`,
   zhq:`人的正常体温约为___ °C（填 37 / 100）`,
   check:a=>a.trim()==='37',ans:'37',choice:true,
   hint:'A fever is around 38–39 °C.',zhh:'发烧大约 38–39 °C。'};
 } else if(type===4){
  const a=ri(10,30);
  return {q:`The temperature rises from ${a} °C to ${a+5} °C. By how many °C did it rise?`,
   zhq:`温度从 ${a} °C 升到 ${a+5} °C，升高了多少 °C？`,
   check:b=>parseInt(b)===5,ans:'5',hint:'rise = final − start',zhh:'升高 = 末温 − 初温'};
 } else {
  const hi=ri(50,90);
  return {q:`Which is hotter: ${hi} °C or 100 °C? (type: ${hi} / 100)`,
   zhq:`哪个更热：${hi} °C 还是 100 °C？（填 ${hi} / 100）`,
   check:a=>a.trim()==='100',ans:'100',choice:true,
   hint:'a bigger number means hotter.',zhh:'数字越大越热。'};
 }
},
k2:()=>{ // melting & freezing
 const type=ri(1,5);
 if(type===1){
  return {q:`The change from solid to liquid is called ___ (type: melting / freezing)`,
   zhq:`物质从固态变成液态叫___（填 melting / freezing）`,
   check:a=>a.trim().toLowerCase()==='melting',ans:'melting',choice:true,
   hint:'solid → liquid.',zhh:'固态→液态。'};
 } else if(type===2){
  return {q:`The change from liquid to solid is called ___ (type: freezing / boiling)`,
   zhq:`从液态变成固态叫___（填 freezing / boiling）`,
   check:a=>a.trim().toLowerCase()==='freezing',ans:'freezing',choice:true,
   hint:'liquid → solid.',zhh:'液态→固态。'};
 } else if(type===3){
  return {q:`During melting, the temperature ___ (type: stays the same / keeps rising)`,
   zhq:`熔化过程中，温度___（填 stays the same / keeps rising）`,
   check:a=>a.trim().toLowerCase()==='stays the same',ans:'stays the same',choice:true,
   hint:'the heat goes into the change of state, not into raising the temperature.',zhh:'热量用于物态变化，不用来升温。'};
 } else if(type===4){
  return {q:`A substance with its own fixed shape is a ___ (type: solid / gas)`,
   zhq:`有固定形状的物质是___（填 solid / gas）`,
   check:a=>a.trim().toLowerCase()==='solid',ans:'solid',choice:true,
   hint:'solids keep their shape.',zhh:'固体保持形状。'};
 } else {
  return {q:`The melting point of ice is ___ °C.`,
   zhq:`冰的熔点是___ °C。`,
   check:a=>parseInt(a)===0,ans:'0',hint:'same number as the freezing point.',zhh:'与凝固点相同。'};
 }
},
k3:()=>{ // vaporisation & liquefaction
 const type=ri(1,6);
 if(type===1){
  return {q:`The change from liquid to gas is called ___ (type: vaporisation / condensation)`,
   zhq:`从液态变成气态叫___（填 vaporisation / condensation）`,
   check:a=>a.trim().toLowerCase()==='vaporisation',ans:'vaporisation',choice:true,
   hint:'liquid → gas.',zhh:'液态→气态。'};
 } else if(type===2){
  return {q:`Boiling happens at one fixed temperature called the ___ (type: boiling point / melting point)`,
   zhq:`沸腾发生在某个固定温度，叫___（填 boiling point / melting point）`,
   check:a=>a.trim().toLowerCase()==='boiling point',ans:'boiling point',choice:true,
   hint:'boiling happens throughout the liquid at one temperature.',zhh:'沸腾在固定温度、液体内部发生。'};
 } else if(type===3){
  return {q:`Evaporation makes a surface feel ___ (type: cooler / warmer)`,
   zhq:`蒸发让表面感觉___（填 cooler / warmer）`,
   check:a=>a.trim().toLowerCase()==='cooler',ans:'cooler',choice:true,
   hint:'fast particles leave, taking energy with them.',zhh:'跑掉的是最快的粒子，带走能量。'};
 } else if(type===4){
  return {q:`The change from gas to liquid is called ___ (type: condensation / sublimation)`,
   zhq:`从气态变成液态叫___（填 condensation / sublimation）`,
   check:a=>a.trim().toLowerCase()==='condensation',ans:'condensation',choice:true,
   hint:'gas → liquid.',zhh:'气态→液态。'};
 } else if(type===5){
  return {q:`Water's boiling point is ___ °C.`,
   zhq:`水的沸点是___ °C。`,
   check:a=>parseInt(a)===100,ans:'100',hint:'same as the Celsius upper fixed point.',zhh:'即摄氏上固定点。'};
 } else {
  return {q:`Boiling happens throughout the liquid, but evaporation happens only at the ___ (type: surface / bottom)`,
   zhq:`沸腾在液体内部各处发生，蒸发只发生在___（填 surface / bottom）`,
   check:a=>a.trim().toLowerCase()==='surface',ans:'surface',choice:true,
   hint:'evaporation is a surface effect.',zhh:'蒸发是表面现象。'};
 }
},
k4:()=>{ // sublimation & deposition
 const type=ri(1,5);
 if(type===1){
  return {q:`Dry ice turning straight from solid to gas is ___ (type: sublimation / deposition)`,
   zhq:`干冰直接从固态变成气态是___（填 sublimation / deposition）`,
   check:a=>a.trim().toLowerCase()==='sublimation',ans:'sublimation',choice:true,
   hint:'solid → gas, no liquid step.',zhh:'固态→气态，不经液态。'};
 } else if(type===2){
  return {q:`Frost forming directly from water vapour is ___ (type: deposition / sublimation)`,
   zhq:`霜由水蒸气直接变成固态是___（填 deposition / sublimation）`,
   check:a=>a.trim().toLowerCase()==='deposition',ans:'deposition',choice:true,
   hint:'gas → solid directly.',zhh:'气态→固态，直接。'};
 } else if(type===3){
  return {q:`Solid to gas directly is called ___ (type: sublimation / condensation)`,
   zhq:`固态直接变气态叫___（填 sublimation / condensation）`,
   check:a=>a.trim().toLowerCase()==='sublimation',ans:'sublimation',choice:true,
   hint:'skip the liquid.',zhh:'跳过液态。'};
 } else if(type===4){
  return {q:`Gas to solid directly is called ___ (type: deposition / evaporation)`,
   zhq:`气态直接变固态叫___（填 deposition / evaporation）`,
   check:a=>a.trim().toLowerCase()==='deposition',ans:'deposition',choice:true,
   hint:'reverse of sublimation.',zhh:'升华的逆过程。'};
 } else {
  return {q:`An example of sublimation is ___ (type: dry ice / water boiling)`,
   zhq:`下列属于升华的例子是___（填 dry ice / water boiling）`,
   check:a=>a.trim().toLowerCase()==='dry ice',ans:'dry ice',choice:true,
   hint:'dry ice (solid CO₂) goes straight to gas.',zhh:'干冰（固态 CO₂）直接变气体。'};
 }
},
};

function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0,diff=1;
 function newQ(){q=gen(diff);tries=0;}
 const update=()=>{
  el.innerHTML=`
   <div class="step"><span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})</div>
   <div class="diff">
    Difficulty: 
    <button class="secondary ${diff===1?'on':''}" data-d="1">Easy</button>
    <button class="secondary ${diff===2?'on':''}" data-d="2">Medium</button>
    <button class="secondary ${diff===3?'on':''}" data-d="3">Hard</button>
    <span class="info">Correct: ${s.prac.ok}/${s.prac.tot} (streak ${streak})<button class="secondary" id="rs" style="margin-left:8px"><span class="en">Reset</span><span class="zh">重置</span></button></span>
   </div>
   <div class="progress"><div style="width:${(streak/need)*100}%"></div></div>
   <div class="q">
    <div class="q-text">${L(q.q,q.zhq)}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="pi" autocomplete="off" placeholder="?"> <button id="ps"><span class="en">Submit</span><span class="zh">提交</span></button>
    </div>
    <div class="hint" id="ph"></div>
    <div class="feedback" id="pf"></div>
   </div>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=parseInt(b.dataset.d);update();});
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;diff=1;save();update();renderNav();};
  const syncTop=()=>{
   const stp=el.querySelector('.step'); if(stp) stp.innerHTML='<span class="en">Practice</span><span class="zh">练习</span> ('+streak+'/'+need+')';
   const pg=el.querySelector('.progress'); if(pg&&pg.firstElementChild) pg.firstElementChild.style.width=(streak/need)*100+'%';
   const inf=el.querySelector('.info'); if(inf){const rb=inf.querySelector('#rs');inf.textContent='Correct: '+s.prac.ok+'/'+s.prac.tot+' (streak '+streak+') ';if(rb)inf.appendChild(rb);}
  };
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();
  el.querySelector('#ps').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.innerHTML=L('✓ correct!','✓ 对了！');
    inp.disabled=true;syncTop();
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>'+L('Section cleared ✓','本节过关 ✓')+'</strong>';save();renderNav();}
    else if(streak>=3&&diff<3){diff++;}
    setTimeout(()=>{newQ();update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.innerHTML=L(q.hint||'Have another go.', q.zhh||'再试一次。');
     fb.className='feedback show err';fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
    } else if(tries===2){
     fb.className='feedback show err';
     fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.')), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):(q.zhh?('提示：'+q.zhh):'再算一遍。')));
    } else {
     streak=0;s.prac.tot++;syncTop();
     if(diff>1)diff--;
     fb.className='feedback show err';
     fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
   save();
  }
 };
 newQ();update();
}

   S.test={ok,tot:qs.length};save();renderNav();return;
  }
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${L(q.q,q.zhq)}</div><div style="display:flex;gap:8px"><input id="ti" autocomplete="off"><button id="ts"><span class="en">Submit</span><span class="zh">提交</span></button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ Render ============ */
const GLOSS={k1:"温度",k2:"熔化和凝固",k3:"汽化和液化",k4:"升华和凝华",test:""};
const USE_MICRO=true;
const INTRO={why:"Matter keeps changing shape around you — ice in a drink, steam from a kettle, frost on a window. Knowing the six changes (melting, freezing, vaporisation, condensation, sublimation, deposition) lets you explain the weather, the kitchen, and the planet's water cycle. These ideas sit behind cooking, climate, and every cold drink on a hot day.",whyZh:"你身边到处是物质在变样——杯里的冰、水壶的蒸汽、窗上的霜。弄清六条变化（熔化、凝固、汽化、液化、升华、凝华），就能解释天气、厨房和地球的水循环。这些道理藏在烹饪、气候和每一杯夏日冷饮背后。",desc:{k1:"What temperature is, thermometers, and the Celsius scale (0–100 °C)",k2:"Solid, liquid, gas; melting and freezing at a fixed temperature",k3:"Vaporisation (evaporation and boiling) and liquefaction (condensation)",k4:"Sublimation (solid to gas) and deposition (gas to solid)"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');
  let h='<div class="intro-h"><span class="en">What this chapter covers</span><span class="zh">本章学什么</span></div>'
    +'<div class="intro-sub"><span class="en">Here is what this chapter walks you through, in order. Read it first, then start the first lesson below.</span><span class="zh">下面是这一章要走的全部内容，按顺序排好。先看一遍，再点下面开始第一小节。</span></div><div class="kp">';
  pts.forEach(l=>{
    const s=st(l.id);
    const badge=s.done?' <span class="st ok">✓ done</span>':(s.prac.tot>0?' <span class="st">'+s.prac.ok+'/'+s.prac.tot+'</span>':'');
    h+='<div class="kp-c"><div class="n">'+l.n+'</div><div class="t">'+l.t+(GLOSS[l.id]?' <span class="cn-tag">'+GLOSS[l.id]+'</span>':'')+'</div><div class="d">'+((INTRO.desc&&INTRO.desc[l.id])||'')+'</div>'+badge+'</div>';
  });
  h+='</div>';
  h+='<div class="why"><b><span class="en">Where this shows up in real life</span><span class="zh">在真实生活里哪里会用到</span></b><br>'+L(INTRO.why,INTRO.whyZh)+'</div>';
  h+='<div class="box"><b><span class="en">How this chapter works</span><span class="zh">本章怎么学</span></b><div class="how">'
    +'① <b><span class="en">Watch the lesson</span><span class="zh">看微课</span></b>: <span class="en">a few minutes to get what the section is about</span><span class="zh">花几分钟了解本节内容</span><br>'
    +'② <b><span class="en">Practice</span><span class="zh">练一练</span></b>: <span class="en">5 correct in a row clears it; if you get stuck, hints walk you through</span><span class="zh">连对 5 题就算过关；卡住了就看提示</span><br>'
    +'③ <b><span class="en">Next section</span><span class="zh">下一节</span></b>: <span class="en">on the left, </span><span class="zh">在左侧，</span>'+pts[0].n+', '+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">'+pts[0].n+' <span class="en">'+pts[0].t+'</span><span class="zh">开始 · '+NAVZH[pts[0].id]+'</span> →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
const NAVZH={"intro":"概览","k1":"温度","k2":"熔化和凝固","k3":"汽化和液化","k4":"升华和凝华","test":"章末自己测"};
const LKEY='phys8_lang';
function getLang(){return localStorage.getItem(LKEY)||'en';}
function setLang(l){localStorage.setItem(LKEY,l);applyLang();}
function applyLang(){const l=getLang();document.body.className=(' '+document.body.className+' ').replace(/\s+lang-(en|mix|zh)\b/g,' ').trim();if(l==='mix'||l==='zh')document.body.classList.add('lang-'+l);document.querySelectorAll('.langseg button').forEach(b=>{b.classList.toggle('on',b.dataset.lang===l);});}
applyLang();

function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}">
   <span><b>${l.n}</b> <span class="en">${l.t}</span><span class="zh">${NAVZH[l.id]||l.t}</span></span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{
  const id=n.dataset.go;
  cur = id==='test' ? 'test' : `micro-${id}`;
  render();
 });
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown lesson</div>';return;}
  const titles={k1:'Temperature',k2:'Melting & Freezing',k3:'Vaporisation & Liquefaction',k4:'Sublimation & Deposition'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · <span class="en">${titles[id]} · ${lesson.cn}</span><span class="zh">${NAVZH[id]||titles[id]}</span></div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){
   practice(c,id);
  }
 } else {
  introRender(main);
 }
}
render();
</script>
