   <p><span class="en">A <b class="num">convex</b> lens is thicker in the middle — it bulges out. A <b class="num">concave</b> lens is thinner in the middle — it caves in.</span><span class="zh"><b class="num">凸透镜</b>中间厚、向外鼓；<b class="num">凹透镜</b>中间薄、向内凹。</span></p>

   <p><span class="en">A convex lens bends parallel rays <b class="num">together</b> to a point. A concave lens spreads them <b class="num">apart</b>. That is why one collects light and the other scatters it.</span><span class="zh">凸透镜把平行光<b class="num">会聚</b>到一点；凹透镜把平行光<b class="num">发散</b>开。一个聚光，一个散光。</span></p>

   <p><span class="en">The point where rays meet (for a convex lens) is the <b class="num">focal point</b>. The distance from the lens to that point is the <b class="num">focal length</b> (f). A stronger lens has a shorter focal length.</span><span class="zh">平行光会聚的点叫<b class="num">焦点</b>；透镜到焦点的距离叫<b class="num">焦距</b>（f）。透镜越强，焦距越短。</span></p>
  </div>

function diag(el,lessonId,generator){
 el.innerHTML=`<div class="step"><span class="en">Quick check</span><span class="zh">小测一下</span></div><div class="box"><p style="font-size:14px;color:var(--muted)">3 questions, just to see where you stand. Pass 3/3 to skip the lesson; otherwise the lesson comes next.</p><div id="diagQ"></div></div>`;
 const qEl=el.querySelector('#diagQ');
 let ok=0;
 const qs=Array.from({length:3},()=>generator('diag'));
 let i=0;
 const show=()=>{
  if(i>=3){
   st(lessonId).diag=ok;
   if(ok===3){
    qEl.innerHTML=`<div class="note" style="background:#dcfce7;border-color:var(--ok)"><strong>3/3:</strong> you already have this — skip the lesson and go to practice.</div><div style="margin-top:14px"><button id="skipMicro"><span class="en">Skip the lesson, go to practice →</span><span class="zh">跳过微课，去做练习 →</span></button></div>`;
    qEl.querySelector('#skipMicro').onclick=()=>{cur=`prac-${lessonId}`;render();};
   } else {
    qEl.innerHTML=`<div class="note" style="background:#fef3c7;border-color:var(--warn)"><strong>${ok}/3:</strong> work through the lesson below to fill the gap.</div><div style="margin-top:14px"><button id="goMicro"><span class="en">Go to lesson →</span><span class="zh">去看微课 →</span></button></div>`;
    qEl.querySelector('#goMicro').onclick=()=>{cur=`micro-${lessonId}`;render();};
   }
   save();renderNav();
   return;
  }
  const q=qs[i];
  qEl.innerHTML=`
   <div class="q">

    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="da" autocomplete="off" placeholder="?"> <button id="sub"><span class="en">Submit</span><span class="zh">提交</span></button>
    </div>
    <div class="hint" id="ht"></div>
    <div class="feedback" id="fb"></div>
   </div>`;
  const input=qEl.querySelector('#da'),fb=qEl.querySelector('#fb'),ht=qEl.querySelector('#ht');
  input.focus();
  qEl.querySelector('#sub').onclick=check;
  input.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const ans=input.value.trim();
   const correct=q.check(ans);
   if(correct===true){ok++;fb.className='feedback show ok';fb.innerHTML=L('✓ Correct · correct','✓ 正确 · 对了');input.disabled=true;setTimeout(()=>{i++;show();},700);}

   else{fb.className='feedback show err';fb.innerHTML=L('✗ Not right, try again.','✗ 不对，再试一次。');}
  }
 };
 show();
}

   </div>
   <div id="vc${i}" style="display:${watched?'block':'none'};position:relative;padding-top:56.25%">
    ${yt?`<iframe src="https://www.youtube.com/embed/${yt}" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>`:'<div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:#f3f4f6">video id pending Khan mapping</div>'}
   </div>
  </div>`;
 });
 el.innerHTML=html;
 el.querySelectorAll('[data-i]').forEach(b=>{
  b.onclick=()=>{
   const i=parseInt(b.dataset.i);
   const slot=el.querySelector('#vc'+i);
   slot.style.display = slot.style.display==='none'?'block':'none';
   st(lessonId).vid[i]=true;save();renderNav();
   b.parentElement.querySelector('.st').className='st ok';
   b.parentElement.querySelector('.st').textContent='✓ watched';
  };
 });
}

/* ============ Practice module ============ */
function practice(el,lessonId){
 const gen=generators[lessonId];
 if(!gen){el.innerHTML='<div class="note">No practice for this.</div>';return;}
 const s=st(lessonId);
 let streak=0,need=5,q=null,tries=0,diff=1;
 function newQ(){q=gen(diff);tries=0;}
 const update=()=>{
  el.innerHTML=`
   <div class="step"><span class="en">Practice</span><span class="zh">练习</span> (${streak}/${need})</div>
   <div class="diff">
    Difficulty: 
    <button class="secondary ${diff===1?'on':''}" data-d="1">Easy</button>
    <button class="secondary ${diff===2?'on':''}" data-d="2">Medium</button>
    <button class="secondary ${diff===3?'on':''}" data-d="3">Hard</button>
    <span class="info">Correct: ${s.prac.ok}/${s.prac.tot} (streak ${streak})<button class="secondary" id="rs" style="margin-left:8px"><span class="en">Reset</span><span class="zh">重置</span></button></span>
   </div>
   <div class="progress"><div style="width:${(streak/need)*100}%"></div></div>
   <div class="q">
    <div class="q-text">${L(q.q,q.zhq)}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <input type="text" id="pi" autocomplete="off" placeholder="?"> <button id="ps"><span class="en">Submit</span><span class="zh">提交</span></button>
    </div>
    <div class="hint" id="ph"></div>
    <div class="feedback" id="pf"></div>
   </div>`;
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=parseInt(b.dataset.d);update();});
  el.querySelector('#rs').onclick=()=>{s.prac={ok:0,tot:0};streak=0;diff=1;save();update();renderNav();};
  const syncTop=()=>{
   const stp=el.querySelector('.step'); if(stp) stp.innerHTML='<span class="en">Practice</span><span class="zh">练习</span> ('+streak+'/'+need+')';
   const pg=el.querySelector('.progress'); if(pg&&pg.firstElementChild) pg.firstElementChild.style.width=(streak/need)*100+'%';
   const inf=el.querySelector('.info'); if(inf){const rb=inf.querySelector('#rs');inf.textContent='Correct: '+s.prac.ok+'/'+s.prac.tot+' (streak '+streak+') ';if(rb)inf.appendChild(rb);}
  };
  const inp=el.querySelector('#pi'),fb=el.querySelector('#pf'),ht=el.querySelector('#ph');
  inp.focus();
  el.querySelector('#ps').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const a=inp.value.trim();
   const r=q.check(a);
   if(r===true){
    streak++;s.prac.ok++;s.prac.tot++;
    fb.className='feedback show ok';fb.innerHTML=L('✓ correct!','✓ 对了！');
    inp.disabled=true;syncTop();
    if(streak>=need){s.done=true;fb.innerHTML+='<br><strong>'+L('Section cleared ✓','本节过关 ✓')+'</strong>';save();renderNav();}
    else if(streak>=3&&diff<3){diff++;}
    setTimeout(()=>{newQ();update();},900);
   } else {
    tries++;
    if(tries===1){
     ht.className='hint show';ht.innerHTML=L(q.hint||'Have another go.', q.zhh||'再试一次。');
     fb.className='feedback show err';fb.innerHTML=L('✗ Try again. ','✗ 再试一次。');
    } else if(tries===2){
     fb.className='feedback show err';
     fb.innerHTML=L('✗ Not quite. '+(q.sol?('Method: '+q.sol):(q.hint?('Hint: '+q.hint):'Work through it once more.')), '✗ 不太对。'+(q.zhs?('方法：'+q.zhs):(q.zhh?('提示：'+q.zhh):'再算一遍。')));
    } else {
     streak=0;s.prac.tot++;syncTop();
     if(diff>1)diff--;
     fb.className='feedback show err';
     fb.innerHTML=L('The answer is <b>'+q.ans+'</b>'+(q.sol?('. '+q.sol):'. '), '答案是 <b>'+q.ans+'</b>'+(q.zhs?('。'+q.zhs):'。'));
     inp.disabled=true;save();renderNav();
     setTimeout(()=>{q=gen();tries=0;update();},2400);
    }
   }
   save();
  }
 };
 newQ();update();
}

/* ============ Chapter check ============ */
function chTest(el){
 const N=10;
 el.innerHTML=`<div class="step"><span class="en">Chapter check</span><span class="zh">章末自己测</span></div><div class="box"><p style="font-size:13px;color:var(--muted)">${N} questions covering every topic in this chapter. Not timed, not scored.</p><div id="tq"></div></div>`;
 const tq=el.querySelector('#tq');
 const qs=[];
 for(let i=0;i<2;i++)qs.push(generators.k1(i+1));
 for(let i=0;i<2;i++)qs.push(generators.k2(i+1));
 for(let i=0;i<2;i++)qs.push(generators.k3(i+1));
 for(let i=0;i<2;i++)qs.push(generators.k4(i+1));
 for(let i=0;i<2;i++)qs.push(generators.k5(i+1));
 let i=0,ok=0;
 const show=()=>{
  if(i>=qs.length){
   const pass=ok>=Math.ceil(qs.length*0.7);
   tq.innerHTML=`<div class="note" style="background:${pass?'#dcfce7':'#fef3c7'};border-color:${pass?'var(--ok)':'var(--warn)'}"><strong>${ok}/${qs.length}</strong> ${pass?'Chapter passed! Move on to the next chapter':'Go back and review what you missed'}</div>`;
   S.test={ok,tot:qs.length};save();renderNav();return;
  }
  const q=qs[i];
  tq.innerHTML=`<div class="q"><div class="q-text">${i+1}/${qs.length}. ${L(q.q,q.zhq)}</div><div style="display:flex;gap:8px"><input id="ti" autocomplete="off"><button id="ts"><span class="en">Submit</span><span class="zh">提交</span></button></div><div class="hint" id="th"></div><div class="feedback" id="tf"></div></div>`;
  const inp=tq.querySelector('#ti'),fb=tq.querySelector('#tf'),ht=tq.querySelector('#th');
  inp.focus();tq.querySelector('#ts').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check();};
  function check(){
   const r=q.check(inp.value.trim());
   if(r===true){ok++;fb.className='feedback show ok';fb.textContent='✓';inp.disabled=true;setTimeout(()=>{i++;show();},600);}
   else if(r==='hint'){ht.className='hint show';ht.textContent=q.hint;}
   else{fb.className='feedback show err';fb.textContent='✗';setTimeout(()=>{i++;show();},900);}
  }
 };
 show();
}

/* ============ Render ============ */
const GLOSS={k1:"透镜",k2:"生活中的透镜",k3:"凸透镜成像规律",k4:"眼睛和眼镜",k5:"显微镜和望远镜",test:""};
const USE_MICRO=true;
const INTRO={why:"Lenses are everywhere — in your eyes, your phone camera, glasses, microscopes, and telescopes. This chapter shows how the shape of a lens decides whether it gathers light or scatters it, how a single convex lens can make a camera, a projector, or a magnifier depending on distance, how your eye focuses and why glasses fix blurry vision, and how two lenses together let you see a cell or a star.",
whyZh:"透镜无处不在——在你眼睛里、手机摄像头里、眼镜里、显微镜和望远镜里。这一章讲：透镜的形状如何决定它是聚光还是散光；同一片凸透镜，距离不同，能当相机、投影仪或放大镜；眼睛怎么聚焦、眼镜怎么矫正模糊；两片透镜怎样让你看见细胞、也看见星星。",desc:{k1:"Convex vs concave; what each does to light; focal point and focal length",k2:"Camera, projector, magnifier — one convex lens, three jobs",k3:"Where the image lands as the object distance changes (u vs f)",k4:"How the eye focuses; myopia and hyperopia and their correction",k5:"Microscope and telescope: two lenses working together"}};
function goLesson(id){cur=USE_MICRO?('micro-'+id):id;render();}
function introRender(main){
  const pts=LESSONS.filter(l=>l.id!=='test'&&l.id!=='intro');
  let h='<div class="intro-h"><span class="en">What this chapter covers</span><span class="zh">本章学什么</span></div>'
    +'<div class="intro-sub"><span class="en">Here is what this chapter walks you through, in order. Read it first, then start the first lesson below.</span><span class="zh">下面是这一章要走的全部内容，按顺序排好。先看一遍，再点下面开始第一小节。</span></div><div class="kp">';
  pts.forEach(l=>{
    const s=st(l.id);
    const badge=s.done?' <span class="st ok">✓ done</span>':(s.prac.tot>0?' <span class="st">'+s.prac.ok+'/'+s.prac.tot+'</span>':'');
    h+='<div class="kp-c"><div class="n">'+l.n+'</div><div class="t">'+l.t+(GLOSS[l.id]?' <span class="cn-tag">'+GLOSS[l.id]+'</span>':'')+'</div><div class="d">'+((INTRO.desc&&INTRO.desc[l.id])||'')+'</div>'+badge+'</div>';
  });
  h+='</div>';
  h+='<div class="why"><b><span class="en">Where this shows up in real life</span><span class="zh">在真实生活里哪里会用到</span></b><br>'+L(INTRO.why,INTRO.whyZh)+'</div>';
  h+='<div class="box"><b><span class="en">How this chapter works</span><span class="zh">本章怎么学</span></b><div class="how">'
    +'① <b><span class="en">Watch the lesson</span><span class="zh">看微课</span></b>: <span class="en">a few minutes to get what the section is about</span><span class="zh">花几分钟了解本节内容</span><br>'
    +'② <b><span class="en">Practice</span><span class="zh">练一练</span></b>: <span class="en">5 correct in a row clears it; if you get stuck, hints walk you through</span><span class="zh">连对 5 题就算过关；卡住了就看提示</span><br>'
    +'③ <b><span class="en">Next section</span><span class="zh">下一节</span></b>: <span class="en">on the left, </span><span class="zh">在左侧，</span>'+pts[0].n+', '+pts[1].n+'… open whichever you want, in any order'
    +'</div></div>';
  h+='<div class="big-start"><button id="startBtn">'+pts[0].n+' <span class="en">'+pts[0].t+'</span><span class="zh">开始 · '+NAVZH[pts[0].id]+'</span> →</button></div>';
  main.innerHTML=h;
  main.querySelector('#startBtn').onclick=()=>{goLesson(pts[0].id);};
}
const NAVZH={"intro":"概览","k1":"透镜","k2":"生活中的透镜","k3":"凸透镜成像规律","k4":"眼睛和眼镜","k5":"显微镜和望远镜","test":"章末自己测"};
const LKEY='phys8_lang';
function getLang(){return localStorage.getItem(LKEY)||'en';}
function setLang(l){localStorage.setItem(LKEY,l);applyLang();}
function applyLang(){const l=getLang();document.body.className=(' '+document.body.className+' ').replace(/\s+lang-(en|mix|zh)\b/g,' ').trim();if(l==='mix'||l==='zh')document.body.classList.add('lang-'+l);document.querySelectorAll('.langseg button').forEach(b=>{b.classList.toggle('on',b.dataset.lang===l);});}
applyLang();

function renderNav(){
 const nav=document.getElementById('nav');
 nav.innerHTML=LESSONS.map(l=>{
  const s=st(l.id);
  let stxt='';
  if(s.done)stxt='<span class="st ok">✓</span>';
  else if(s.prac.tot>0)stxt=`<span class="st ${s.prac.ok/s.prac.tot>0.6?'ok':'err'}">${s.prac.ok}/${s.prac.tot}</span>`;
  return `<div class="nav-i ${l.id===cur||cur===`micro-${l.id}`||cur===`diag-${l.id}`||cur===`prac-${l.id}`?'on':''}" data-go="${l.id}">
   <span><b>${l.n}</b> <span class="en">${l.t}</span><span class="zh">${NAVZH[l.id]||l.t}</span></span>${stxt}</div>`;
 }).join('');
 nav.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>{
  const id=n.dataset.go;
  cur = id==='test' ? 'test' : `micro-${id}`;
  render();
 });
}

function render(){
 const main=document.getElementById('main');
 renderNav();
 if(cur==='intro'||cur==='micro-intro'){introRender(main);return;}
 if(cur==='test'){chTest(main);return;}
 const m=cur.match(/^(diag|micro|prac)-(\w+)$/);
 if(m){
  const phase=m[1],id=m[2];
  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson){main.innerHTML='<div class="note">Unknown lesson</div>';return;}
  const titles={k1:'Lenses',k2:'Lenses in life',k3:'Imaging with convex lens',k4:'Eye and glasses',k5:'Microscope & telescope'};
  main.innerHTML=`<div class="lesson-id">${lesson.n} · <span class="en">${titles[id]} · ${lesson.cn}</span><span class="zh">${NAVZH[id]||titles[id]}</span></div>`;
  const c=document.createElement('div');main.appendChild(c);
  if(phase==='diag'){
   if(st(id).diag===3){cur=`micro-${id}`;render();return;}
   diag(c,id,generators[id]);
  } else if(phase==='micro'){
   if(id==='k1')microK1(c);
   else if(id==='k2')microK2(c);
   else if(id==='k3')microK3(c);
   else if(id==='k4')microK4(c);
   else if(id==='k5')microK5(c);
   const after=document.createElement('div');main.appendChild(after);
   videos(after,id);
   const btn=document.createElement('div');btn.style.marginTop='14px';
   btn.innerHTML=`<button id="toPrac">Go to practice</button>`;
   main.appendChild(btn);
   btn.querySelector('#toPrac').onclick=()=>{cur=`prac-${id}`;render();};
  } else if(phase==='prac'){
   practice(c,id);
  }
 } else {
  introRender(main);
 }
}
render();
</script>
<script>
(function(){try{if(new URLSearchParams(location.search).get('go')==='test'){cur='test';render();}}catch(e){}})();
</script>

 for(var i=0;i<bs.length;i++){

 }
}
